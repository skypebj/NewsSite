name: News Pipeline

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

env:
  ENABLE_SCREENSHOT: 'true'   # 可设为 'false' 关闭截图

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Fetch HTML
        run: python scripts/fetch_html.py
      - name: Extract JSON & Translate & Deduplicate
        run: python scripts/extract_json.py
      - name: Screenshot (if enabled)
        run: python scripts/screenshot.py
      - name: Generate WordCloud
        run: python scripts/generate_wordcloud.py
      - name: Generate EPUB
        run: python scripts/generate_epub.py
      - name: Archive screenshots (if first day of month)
        run: python scripts/archive.py
      - name: Generate Dashboard & Index Page
        run: python scripts/generate_index.py   # 需要实现
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "自动更新新闻数据 [skip ci]"
          git push
